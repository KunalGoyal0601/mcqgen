name: MCQ generator tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src
      - name: Validate notebook JSON
        run: python -c "import json; json.load(open('notebooks/mcq.ipynb', encoding='utf-8'))"
